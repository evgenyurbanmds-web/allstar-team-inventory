<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>All Star Team | Inventory</title>
<style>
:root{font-family:system-ui,Arial,sans-serif;color:#172638;background:#f4f6fa}*{box-sizing:border-box}body{margin:0}header{background:#142b45;color:white;padding:22px max(24px,calc((100vw - 1000px)/2))}header strong{font-size:22px}header small{display:block;color:#b8c7d9;margin-top:4px}main{max-width:1000px;margin:30px auto;padding:0 20px}.panel{background:white;border:1px solid #e3e9f1;border-radius:14px;padding:24px;margin:16px 0;box-shadow:0 3px 16px #183b6010}h2{margin:0 0 16px;font-size:20px}input,button{font:inherit;border-radius:8px;padding:12px;border:1px solid #d5dfeb}input{width:100%;margin:7px 0}button{background:#183c63;color:white;cursor:pointer;border:0;margin:8px 8px 0 0}button.secondary{background:#e8eef5;color:#1d3858}.muted{color:#68798a}.error{color:#b42432}.ok{color:#177248}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid #e9eef5;padding:12px 0}.row:last-child{border:0}.hidden{display:none}nav button{background:transparent;color:#41576e;border-bottom:2px solid transparent;border-radius:0}nav button.active{border-color:#183c63;color:#183c63}
</style></head><body>
<header><strong>ALL STAR TEAM</strong><small>Inventory & Sales Management</small></header>
<main><section class="panel" id="login"><h2>Вход владельца</h2><p class="muted">Для доступа к складу требуется авторизация.</p><input id="email" type="email" autocomplete="username" placeholder="Email"><input id="password" type="password" autocomplete="current-password" placeholder="Пароль"><button id="signin">Войти</button><button class="secondary" id="signup">Зарегистрироваться</button><p id="authmsg"></p></section>
<section id="app" class="hidden"><div class="panel"><div class="row"><b id="identity"></b><button class="secondary" id="signout">Выйти</button></div><p class="muted" id="status">Проверяем права доступа...</p></div><div class="panel"><nav><button class="active" id="tabProducts">Товары</button><button id="tabReceipts">Поступления</button><button id="tabSales">Продажи</button></nav><div id="content"></div></div></section></main>
<script>
const URL='https://jrqwscixcxpywpzqnayi.supabase.co';
const KEY='sb_publishable_5vKuFd2TcXsTGkjI1XAIWg_S3DUUVQM';
const $=id=>document.getElementById(id);
let session=null,snapshot=null;
function message(s,err=false){$('authmsg').textContent=s;$('authmsg').className=err?'error':'ok'}
async function auth(path,body){const r=await fetch(URL+'/auth/v1/'+path,{method:'POST',headers:{'apikey':KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});const j=await r.json();if(!r.ok)throw Error(j.msg||j.error_description||j.message||'Ошибка авторизации');return j}
async function rpc(name,args={}){const r=await fetch(URL+'/rest/v1/rpc/'+name,{method:'POST',headers:{'apikey':KEY,'Authorization':'Bearer '+session.access_token,'Content-Type':'application/json'},body:JSON.stringify(args)});const j=await r.json();if(!r.ok)throw Error(j.message||'Ошибка доступа');return j}
async function enter(s){session=s;sessionStorage.setItem('allstar_session',JSON.stringify(s));$('login').classList.add('hidden');$('app').classList.remove('hidden');$('identity').textContent=s.user?.email||'Владелец';await load()}
async function load(){try{snapshot=await rpc('inventory_owner_snapshot');$('status').textContent='Подключено к защищённой базе All Star Team · Владелец';$('status').className='ok';render('products')}catch(e){try{snapshot=await rpc('inventory_manager_snapshot');$('status').textContent='All Star Team · Менеджер (продажи и остатки)';$('status').className='ok';render('products')}catch(err){snapshot=null;$('status').textContent='Доступ пока не настроен: '+err.message;$('status').className='error';$('content').textContent='Обратитесь к владельцу для назначения роли.'}}}
function render(tab){for(const [id,t] of [['tabProducts','products'],['tabReceipts','receipts'],['tabSales','sales']])$(id).classList.toggle('active',t===tab);const a=snapshot?.[tab]||[];const el=$('content');el.replaceChildren();const title=document.createElement('h2');title.textContent=tab==='products'?'Каталог товаров':tab==='receipts'?'Поступления':'Продажи';el.append(title);if(!a.length){const p=document.createElement('p');p.className='muted';p.textContent='Записей пока нет';el.append(p)}for(const item of a){const row=document.createElement('div');row.className='row';const label=document.createElement('span');label.textContent=item.name||item.receipt_date||item.sale_date||item.id;const detail=document.createElement('span');detail.className='muted';detail.textContent=item.status||'';row.append(label,detail);el.append(row)}}
$('signin').onclick=async()=>{try{const s=await auth('token?grant_type=password',{email:$('email').value,password:$('password').value});await enter(s)}catch(e){message(e.message,true)}};
$('signup').onclick=async()=>{try{const s=await auth('signup',{email:$('email').value,password:$('password').value});if(s.access_token)await enter(s);else message('Регистрация отправлена. Проверьте email для подтверждения. Доступ к складу включается отдельно.')}catch(e){message(e.message,true)}};
$('signout').onclick=()=>{sessionStorage.removeItem('allstar_session');session=null;location.reload()};
$('tabProducts').onclick=()=>render('products');$('tabReceipts').onclick=()=>render('receipts');$('tabSales').onclick=()=>render('sales');
try{const s=JSON.parse(sessionStorage.getItem('allstar_session')||'null');if(s?.access_token)enter(s)}catch(e){sessionStorage.removeItem('allstar_session')}
</script>
<style>
.tools{margin-top:18px;border-top:1px solid #e9eef5;padding-top:18px}.tools label{display:block;font-size:13px;color:#546779;margin-top:10px}.tools select,.tools textarea{width:100%;padding:12px;border:1px solid #d5dfeb;border-radius:8px;font:inherit;background:white}.tools textarea{min-height:65px}.tools .hint{font-size:13px;color:#65798c}.tools .result{margin-top:10px;font-size:14px}.stock{font-size:13px;color:#65798c}
</style>
<script>
let activeTab='products';
const oldRender=render;
render=function(tab){
 activeTab=tab;oldRender(tab);
 const area=document.createElement('div');area.className='tools';
 if(tab==='products'){
 area.innerHTML='<h2>Добавить товар</h2><label>Название модели</label><input id="newName" placeholder="Например, HISENSE AX700"><label>Описание (необязательно)</label><textarea id="newDesc" placeholder="UPC, состояние, примечания"></textarea><button id="createProduct">Создать карточку</button><p class="hint">Если модель уже есть, база не создаст дубликат. Создание карточки не меняет остатки.</p><p class="result" id="formMsg"></p>';
 $('content').append(area);
 $('createProduct').onclick=async()=>{
  const name=$('newName').value.trim();if(!name){$('formMsg').textContent='Укажи название';return}
  const b=$('createProduct');b.disabled=true;
  try{await rpc('inventory_owner_create_product',{p_name:name,p_description:$('newDesc').value.trim()||null});await load();$('status').textContent='Карточка сохранена в Supabase';}
  catch(e){$('formMsg').textContent=e.message;b.disabled=false}
 };
 }else if(tab==='receipts'){
 const options=(snapshot?.products||[]).map(p=>'<option value="'+p.id+'">'+escapeText(p.name)+'</option>').join('');
 area.innerHTML='<h2>Черновик поступления</h2><p class="hint">Создаётся только черновик. Товары НЕ поступают на склад до отдельного подтверждения.</p><label>Товар</label><select id="receiptProduct">'+options+'</select><label>Количество</label><input id="receiptQty" type="number" min="1" step="1" value="1"><label>Закупочная стоимость за штуку, $</label><input id="receiptCost" type="number" min="0" step="0.01" value="0"><label>Доставка за штуку, $</label><input id="receiptFreight" type="number" min="0" step="0.01" value="0"><label>Розничная цена за штуку, $ (необязательно)</label><input id="receiptRetail" type="number" min="0" step="0.01"><label>Примечание</label><textarea id="receiptNotes" placeholder="Поставщик, номер заказа"></textarea><button id="draftReceipt">Сохранить черновик</button><p class="result" id="formMsg"></p>';
 $('content').append(area);
 $('draftReceipt').onclick=async()=>{
 const qty=Number($('receiptQty').value),cost=Number($('receiptCost').value),freight=Number($('receiptFreight').value),retail=$('receiptRetail').value;
 if(!Number.isInteger(qty)||qty<1||!Number.isFinite(cost)||cost<0||!Number.isFinite(freight)||freight<0||!$('receiptProduct').value){$('formMsg').textContent='Проверь количество и стоимость';return}
 if(retail!==''&&(!Number.isFinite(Number(retail))||Number(retail)<0)){$('formMsg').textContent='Неверная розничная цена';return}
 const line={product_id:$('receiptProduct').value,quantity:qty,purchase_unit_cost:cost,inbound_freight_unit_cost:freight,retail_unit_price:retail===''?null:Number(retail)};
 const b=$('draftReceipt');b.disabled=true;
 try{await rpc('inventory_owner_create_draft',{p_kind:'receipt',p_lines:[line],p_date:new Date().toLocaleDateString('en-CA'),p_notes:$('receiptNotes').value.trim()||null,p_request_key:crypto.randomUUID()});await load();render('receipts');$('status').textContent='Черновик поступления сохранён. Остатки не изменились.'}
 catch(e){$('formMsg').textContent=e.message;b.disabled=false}
 };
 }else{
 area.innerHTML='<p class="hint">Продажи и списания включим после проверки поступлений и расчёта себестоимости. Реальные операции пока не проводим.</p>';
 $('content').append(area);
 }
};
function escapeText(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
</script>
<style>.docline{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid #e9eef5}.docline button{margin:0}.summary{display:flex;gap:18px;flex-wrap:wrap;margin:12px 0}.metric{background:#f4f6fa;padding:12px 16px;border-radius:9px}.metric b{display:block;font-size:21px}</style>
<script>
const previousRender=render;
const usd=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(Number(n||0));
const productById=id=>(snapshot?.products||[]).find(p=>p.id===id);
const balanceById=id=>(snapshot?.balances||[]).find(b=>b.product_id===id);
const lineList=(kind,id)=>(snapshot?.[kind==='receipt'?'receipt_lines':'sale_lines']||[]).filter(l=>l[kind+'_id']===id);
function addElement(parent,tag,txt,cls){const el=document.createElement(tag);if(cls)el.className=cls;el.textContent=txt;parent.append(el);return el}
async function refreshTab(tab){snapshot=await rpc('inventory_owner_snapshot');render(tab)}
function addDocs(tab){
 const kind=tab==='receipts'?'receipt':'sale';
 const docs=snapshot?.[tab]||[];
 const holder=document.createElement('section');holder.className='tools';
 addElement(holder,'h2','Документы');
 if(!docs.length)addElement(holder,'p','Документов пока нет','muted');
 for(const doc of docs){
  const lines=lineList(kind,doc.id);
  const details=lines.map(l=>{
   const name=productById(l.product_id)?.name||'Товар';
   const amount=kind==='receipt'?usd((Number(l.purchase_unit_cost)+Number(l.inbound_freight_unit_cost))*l.quantity):usd(l.net_proceeds);
   return name+' × '+l.quantity+' — '+amount;
  }).join('; ');
  const row=document.createElement('div');row.className='docline';
  const left=document.createElement('div');
  addElement(left,'b',doc[kind+'_date']+' · '+(doc.status==='draft'?'Черновик':doc.status==='posted'?'Проведён':'Отменён'));
  addElement(left,'div',details||'Нет строк','muted');
  if(doc.notes)addElement(left,'div',doc.notes,'muted');
  row.append(left);
  if(doc.status==='draft'){
   const b=addElement(row,'button',kind==='receipt'?'Оприходовать':'Провести продажу');
   b.onclick=async()=>{
    const action=kind==='receipt'?'ОПРИХОДОВАТЬ':'ПРОВЕСТИ ПРОДАЖУ';
    const explanation=kind==='receipt'?'Остатки и себестоимость изменятся. Подтверждай только после физического получения товара.':'Остатки уменьшатся, прибыль будет рассчитана. Подтверждай только реальную продажу.';
    if(!window.confirm(action+'?\n\n'+details+'\n\n'+explanation))return;
    b.disabled=true;
    try{await rpc('inventory_owner_post_document',{p_kind:'post_'+kind,p_id:doc.id,p_request_key:crypto.randomUUID()});await refreshTab(tab);$('status').textContent='Документ проведён в Supabase'}
    catch(e){window.alert('Не удалось провести документ: '+e.message);b.disabled=false}
   };
  }
  holder.append(row);
 }
 $('content').append(holder);
}
render=function(tab){
 previousRender(tab);
 if(!snapshot)return;
 if(tab==='products'){
  const holder=document.createElement('div');holder.className='tools';
  addElement(holder,'h2','Остатки и себестоимость');
  for(const p of snapshot.products||[]){
   const b=balanceById(p.id);
   const row=document.createElement('div');row.className='row';
   addElement(row,'span',p.name);
   addElement(row,'span',(b?.on_hand||0)+' шт. · '+usd(Number(b?.avg_purchase_cost||0)+Number(b?.avg_freight_cost||0))+'/шт.','stock');
   holder.append(row);
  }
  $('content').append(holder);
 }else if(tab==='receipts'){addDocs(tab)}
 else if(tab==='sales'){
  const old=$('content').querySelector('.tools');if(old)old.remove();
  const area=document.createElement('section');area.className='tools';
  const choices=(snapshot.products||[]).map(p=>'<option value="'+p.id+'">'+escapeText(p.name)+'</option>').join('');
  area.innerHTML='<h2>Новая продажа — черновик</h2><p class="hint">Создание черновика не меняет остатки. Проведение требует отдельного подтверждения.</p><label>Товар</label><select id="saleProduct">'+choices+'</select><p class="hint" id="available"></p><label>Количество</label><input id="saleQty" type="number" min="1" step="1" value="1"><label>Сумма, полученная за все единицы ($)</label><input id="saleProceeds" type="number" min="0" step="0.01" placeholder="Общая сумма после комиссий"><label>Примечание</label><textarea id="saleNotes" placeholder="Площадка, заказ, покупатель"></textarea><button id="draftSale">Сохранить черновик продажи</button><p class="result" id="saleMsg"></p>';
  $('content').append(area);
  const update=()=>{const b=balanceById($('saleProduct').value);$('available').textContent='Доступно на складе: '+(b?.on_hand||0)+' шт.'};
  $('saleProduct').onchange=update;update();
  $('draftSale').onclick=async()=>{
   const qty=Number($('saleQty').value),amount=Number($('saleProceeds').value),id=$('saleProduct').value;
   if(!id||!Number.isInteger(qty)||qty<1||$('saleProceeds').value===''||!Number.isFinite(amount)||amount<0){$('saleMsg').textContent='Проверь товар, количество и сумму';return}
   if(qty>Number(balanceById(id)?.on_hand||0)){$('saleMsg').textContent='Недостаточно товара на складе';return}
   const btn=$('draftSale');btn.disabled=true;
   try{await rpc('inventory_owner_create_draft',{p_kind:'sale',p_lines:[{product_id:id,quantity:qty,net_proceeds:amount,operation_type:'sale'}],p_date:new Date().toLocaleDateString('en-CA'),p_notes:$('saleNotes').value.trim()||null,p_request_key:crypto.randomUUID()});await refreshTab('sales');$('status').textContent='Черновик продажи сохранён. Остатки не изменились.'}
   catch(e){$('saleMsg').textContent=e.message;btn.disabled=false}
  };
  addDocs(tab);
 }
};
</script>
<script>
const renderFull=render;
render=function(tab){
 if(snapshot?.role!=='manager'){renderFull(tab);return}
 $('tabReceipts').classList.add('hidden');
 $('tabProducts').classList.toggle('active',tab==='products');
 $('tabSales').classList.toggle('active',tab==='sales');
 const el=$('content');el.replaceChildren();
 if(tab==='products'){
  addElement(el,'h2','Товары в наличии');
  for(const p of snapshot.products||[]){
   const row=document.createElement('div');row.className='row';
   addElement(row,'span',p.name);
   addElement(row,'b',(balanceById(p.id)?.on_hand||0)+' шт.');
   el.append(row);
  }
  return;
 }
 addElement(el,'h2','Оформление продажи');
 const form=document.createElement('section');form.className='tools';
 const opts=(snapshot.products||[]).map(p=>'<option value="'+p.id+'">'+escapeText(p.name)+'</option>').join('');
 form.innerHTML='<label>Товар</label><select id="managerProduct">'+opts+'</select><p class="hint" id="managerStock"></p><label>Количество</label><input id="managerQty" type="number" min="1" step="1" value="1"><label>Общая сумма продажи, $</label><input id="managerAmount" type="number" min="0" step="0.01" placeholder="После комиссий"><label>Примечание</label><textarea id="managerNotes"></textarea><button id="managerSave">Создать черновик</button><p id="managerMsg" class="result"></p>';
 el.append(form);
 const stock=()=>{$('managerStock').textContent='На складе: '+(balanceById($('managerProduct').value)?.on_hand||0)+' шт.'};$('managerProduct').onchange=stock;stock();
 $('managerSave').onclick=async()=>{
  const id=$('managerProduct').value,qty=Number($('managerQty').value),amount=Number($('managerAmount').value);
  if(!id||!Number.isInteger(qty)||qty<1||$('managerAmount').value===''||!Number.isFinite(amount)||amount<0||qty>Number(balanceById(id)?.on_hand||0)){$('managerMsg').textContent='Проверь количество, остаток и сумму';return}
  const b=$('managerSave');b.disabled=true;
  try{await rpc('inventory_manager_create_sale',{p_product_id:id,p_quantity:qty,p_net_proceeds:amount,p_notes:$('managerNotes').value.trim()||null,p_request_key:crypto.randomUUID()});snapshot=await rpc('inventory_manager_snapshot');render('sales');$('status').textContent='Черновик продажи сохранён';}
  catch(e){$('managerMsg').textContent=e.message;b.disabled=false}
 };
 addElement(el,'h2','Мои продажи');
 for(const s of snapshot.sales||[]){
  const row=document.createElement('div');row.className='docline';
  const left=document.createElement('div');
  const lines=(snapshot.sale_lines||[]).filter(l=>l.sale_id===s.id);
  const description=lines.map(l=>(productById(l.product_id)?.name||'Товар')+' × '+l.quantity+' — '+usd(l.net_proceeds)).join('; ');
  addElement(left,'b',s.sale_date+' · '+(s.status==='draft'?'Черновик':s.status==='posted'?'Проведена':'Отменена'));
  addElement(left,'div',description,'muted');row.append(left);
  if(s.status==='draft'){
   const b=addElement(row,'button','Провести продажу');
   b.onclick=async()=>{
    if(!confirm('Подтвердить реальную продажу?\n'+description+'\nОстатки на складе уменьшатся.'))return;
    b.disabled=true;
    try{await rpc('inventory_manager_post_sale',{p_sale_id:s.id,p_request_key:crypto.randomUUID()});snapshot=await rpc('inventory_manager_snapshot');render('sales');$('status').textContent='Продажа проведена'}
    catch(e){alert('Ошибка: '+e.message);b.disabled=false}
   };
  }
  el.append(row);
 }
};
</script></body></html>
